[package]
name = "tenon-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tenon-daemon"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
async-trait = { workspace = true }
uuid = { workspace = true }
tenon-config = { workspace = true }
tenon-core = { workspace = true }
tenon-store = { workspace = true }
tenon-snapshot = { workspace = true }
tenon-sandbox = { workspace = true }
tenon-fs = { workspace = true }
tenon-models = { workspace = true }
tenon-agent = { workspace = true }
tenon-lsp = { workspace = true }
tenon-laya = { workspace = true }
tenon-registry = { workspace = true }
tenon-mcp = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
hex = "0.4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
libc = "0.2"
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
# 与工作树既有 tauri 传递依赖同版本（Cargo.lock 不新增版本）；仅 pid_alive 存活探测用
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
async-trait = { workspace = true }
