# Tenon CI（ADR-13：fmt / clippy / cargo test / vitest / Playwright / 性能基准）。
# Windows 作业随 WSL2 沙箱（M1）启用；Playwright 与服务层性能门禁已挂载。

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        # windows-latest 随 WSL2 沙箱（M1，§12.3）启用
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Linux 需要 tauri 系（tenon-app 进 workspace，clippy --workspace 全图编译）
      - name: 安装 Linux WebView 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # ubuntu 24.04+ 镜像默认 AppArmor 限制非特权 userns，沙箱 apply 会 EPERM
      - name: 放开非特权用户命名空间（Linux 沙箱测试前置）
        if: runner.os == 'Linux'
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0 || true
      # tauri-build 校验 externalBin 与 resources 路径存在；CI 只做静态检查，
      # 双双占位即可（真实 sidecar 由 release.yml 构建，UI 由 ui job / e2e job 构建）
      - name: 占位 sidecar 与前端产物
        run: |
          mkdir -p app/src-tauri/binaries ui/dist
          echo placeholder > "app/src-tauri/binaries/tenon-daemon-$(rustc -vV | sed -n 's/host: //p')"
          echo placeholder > ui/dist/index.html
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
        env:
          # GLM 联调测试在无 config.local.toml 时自动跳过
          TENON_SKIP_LIVE: "1"

  ui:
    name: UI (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # 工作区单一锁文件在仓库根（无 ui/pnpm-lock.yaml）
          cache-dependency-path: pnpm-lock.yaml
      - name: install
        run: pnpm --filter tenon-ui install --frozen-lockfile
      - name: test
        run: pnpm --filter tenon-ui test
      - name: build
        run: pnpm --filter tenon-ui build

  e2e:
    name: E2E (real daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: install Playwright Chromium
        run: pnpm --filter tenon-ui exec playwright install --with-deps chromium
      - name: build daemon and UI
        run: |
          cargo build -p tenon-daemon --bin tenon-daemon
          pnpm --filter tenon-ui build
      - name: Playwright multi-project daemon E2E
        run: pnpm --filter tenon-ui test:e2e
      - name: upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: ui/test-results/
          if-no-files-found: ignore

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # §8.7 验收预算：release profile 降低调试构建噪声；
      # 用例自身保留绝对阈值，超预算即 CI 失败。
      - name: service-layer budgets
        run: cargo test -p tenon-fs --release --test performance_budgets -- --ignored --nocapture
      # §8.7：runtime 已打开的项目切换核心链路 P50 预算。
      - name: project switch budget
        run: cargo test -p tenon-daemon --release --test daemon_tests warm_project_switch -- --ignored --nocapture
      # §18.4 内核基准：merge / snapshot 持续输出趋势基线。sandbox exec bench
      # 需要宿主特权（Seatbelt / 用户命名空间），托管 runner 不可用——本地跑。
      - name: kernel benches
        run: cargo bench -p tenon-core -p tenon-snapshot --benches
